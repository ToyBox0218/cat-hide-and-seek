<script>
'use strict';
const VERSION=1,KEY='toybox-grade1-midterm-v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function verticalReading(syllable){const tone=(syllable.match(/[ˊˇˋ˙]/)||[''])[0],symbols=syllable.replace(/[ˊˇˋ˙]/g,'');return `<rt class="zhuyin-reading ${tone==='˙'?'neutral':''}"><span class="bpmf-stack">${[...symbols].map(s=>`<span>${esc(s)}</span>`).join('')}</span>${tone?`<span class="tone-mark">${tone}</span>`:''}</rt>`;}
function ruby(text,reading){const syllables=reading.trim()?reading.trim().split(/\s+/):[];let i=0;const html=[...text].map(c=>/[\u3400-\u9fff]/.test(c)?`<ruby class="zhuyin"><span class="han">${c}</span><rp>（</rp>${verticalReading(syllables[i++]||'')}<rp>）</rp></ruby>`:esc(c)).join('');if(i!==syllables.length)throw Error('注音字數不符：'+text);return html;}
const R=ruby;
const INSTRUCTION_READINGS={的:'ㄉㄜ˙',注:'ㄓㄨˋ',音:'ㄧㄣ',是:'ㄕˋ',哪:'ㄋㄚˇ',一:'ㄧˊ',個:'ㄍㄜ˙',加:'ㄐㄧㄚ',上:'ㄕㄤˋ',可:'ㄎㄜˇ',以:'ㄧˇ',拼:'ㄆㄧㄣ',成:'ㄔㄥˊ',第:'ㄉㄧˋ',二:'ㄦˋ',三:'ㄙㄢ',四:'ㄙˋ',聲:'ㄕㄥ',輕:'ㄑㄧㄥ',符:'ㄈㄨˊ',號:'ㄏㄠˋ',裡:'ㄌㄧˇ',少:'ㄕㄠˇ',了:'ㄌㄜ˙',和:'ㄏㄢˋ',完:'ㄨㄢˊ',全:'ㄑㄩㄢˊ',樣:'ㄧㄤˋ'};
function chinesePrompt(text,topic){return text.split(/(「[^」]*」)/).map(part=>{
  // Reading questions keep the quoted target unannotated; quoted instructions
  // such as "第三聲" still receive reading support in tone questions.
  if(topic==='注音拼讀'&&/^「[^」]+」$/.test(part))return `<span class="test-target">${esc(part)}</span>`;
  return [...part].map(c=>{if(!/[\u3400-\u9fff]/.test(c))return esc(c);const reading=INSTRUCTION_READINGS[c];if(!reading)throw Error('題目說明缺少注音：'+c);return R(c,reading);}).join('');
}).join('');}
const Z=(id,p,visual,options,answer,explanation,topic='注音拼讀')=>({id,subject:'zh',p:chinesePrompt(p,topic),plain:p,visual,options:options.map(esc),answer,explanation:esc(explanation),topic});
const M=(id,p,reading,visual,options,answer,explanation,topic)=>({id,subject:'math',p:R(p,reading),plain:p,visual,options:options.map(String),answer,explanation:esc(explanation),topic});

Z('z19','「ㄉㄊ□ㄌ」裡，少了哪一個？','<span class="symbol">ㄉ ㄊ □ ㄌ</span>',['ㄇ','ㄅ','ㄋ','ㄈ'],2,'正確順序是ㄉ、ㄊ、ㄋ、ㄌ。','符號辨識'),
Z('z20','「ㄝ」和哪一個完全一樣？','<span class="symbol">ㄝ</span>',['ㄜ','ㄟ','ㄞ','ㄝ'],3,'ㄝ和ㄝ完全相同。ㄝ和ㄜ是不同的符號。','符號辨識'),
M('m1','一共有幾顆星星？','ㄧˊ ㄍㄨㄥˋ ㄧㄡˇ ㄐㄧˇ ㄎㄜ ㄒㄧㄥ ㄒㄧㄥ',dots('⭐',6),['5','6','7','8'],1,'一顆一顆數，共有6顆星星。','10以內的數'),

M('m7','5可以分成2和多少？','ㄎㄜˇ ㄧˇ ㄈㄣ ㄔㄥˊ ㄏㄢˋ ㄉㄨㄛ ㄕㄠˇ','<span class="numberline">5 → 2 ＋ □</span>',['1','2','3','4'],2,'2和3合起來是5，所以5可以分成2和3。','10以內的分合'),
M('m8','空格裡要填哪個數字？','ㄎㄨㄥˋ ㄍㄜˊ ㄌㄧˇ ㄧㄠˋ ㄊㄧㄢˊ ㄋㄚˇ ㄍㄜ˙ ㄕㄨˋ ㄗˋ','<span class="numberline">7　8　9　□</span>',['6','8','10','11'],2,'9的下一個數是10。','數的順序'),

function extendPassage(id,lines,questions){
  const p=PASSAGES[id];p.lines=lines.map(([t,r])=>R(t,r));p.plain=lines.map(([t])=>t).join('\n');
  const existing=BANK.filter(q=>q.passageId===id);
  questions.forEach(([qid,text,reading,options,answer,why],i)=>addQuestion({id:qid,subject:existing[0].subject,type:'reading',plain:text,p:R(text,reading),visual:'',options:options.map(o=>Array.isArray(o)?R(o[0],o[1]):String(o)),answer,explanation:why,passageId:id,passagePart:existing.length+i+1}));
}

// Each cell is a stack height. Adjacent cells touch; internal faces are omitted.
// Stairs have one row in depth; floor arrangements have one layer in height.
// This keeps every cube countable without guessing any fully hidden cubes.
function cubeCells(layout){return layout.flatMap((row,y)=>row.flatMap((height,x)=>Array.from({length:height},(_,z)=>[x,y,z])));}
function cubeStacks(layout){
 const cells=cubeCells(layout),occupied=new Set(cells.map(c=>c.join(',')));
 const project=([x,y,z])=>[44*x+22*y,-18*y-44*z];
 const corners=cells.flatMap(([x,y,z])=>[0,1].flatMap(dx=>[0,1].flatMap(dy=>[0,1].map(dz=>project([x+dx,y+dy,z+dz])))));
 const minX=Math.min(...corners.map(p=>p[0])),minY=Math.min(...corners.map(p=>p[1])),maxX=Math.max(...corners.map(p=>p[0])),maxY=Math.max(...corners.map(p=>p[1]));
 const point=p=>{const [x,y]=project(p);return (x-minX+18)+','+(y-minY+18);};
 let body='';
 // Back to front, left to right, bottom to top: only the exposed faces remain.
 for(const [x,y,z] of [...cells].sort((a,b)=>b[1]-a[1]||a[0]-b[0]||a[2]-b[2])){
  body+='<g class="counting-cube" data-cube="'+[x,y,z].join(',')+'" stroke="#315a50" stroke-width="2.2" stroke-linejoin="round">';
  const faces=[
   ['top',[x,y,z+1],[[x,y,z+1],[x+1,y,z+1],[x+1,y+1,z+1],[x,y+1,z+1]],'#f5d99e'],
   ['right',[x+1,y,z],[[x+1,y,z],[x+1,y+1,z],[x+1,y+1,z+1],[x+1,y,z+1]],'#8eb6a9'],
   ['front',[x,y-1,z],[[x,y,z],[x+1,y,z],[x+1,y,z+1],[x,y,z+1]],'#d9ede7']
  ];
  for(const [face,neighbor,vertices,color] of faces)if(!occupied.has(neighbor.join(',')))body+='<polygon data-face="'+face+'" points="'+vertices.map(point).join(' ')+'" fill="'+color+'"/>';
  body+='</g>';
 }
 return svgFrame(body,maxX-minX+36,maxY-minY+36,'相連的小方塊堆疊圖，每個小方塊都有看得到的面');
}

const SCHOOL_PLANS={
 zh:{picture:4,tone:4,sound:3,word:3,picturetf:3,dictation:5,reading:8,fill:3,choice:1,blend:3,picturefill:3},
 math:{flat:4,solid:4,cubes:8,reading:4,split:2,merge:2,hidden:2,complete:2,shopping:2,match:2,pair:2,tf:2,fill:2,choice:2}
};
function schoolDraw(subject,previous=[]){
 const pool=BANK.filter(q=>q.subject===subject),plan=SCHOOL_PLANS[subject],blocks=[],avoid=new Set(previous);
 for(const [category,count] of Object.entries(plan)){
  if(category==='reading'){
   const ids=[...new Set(pool.filter(q=>q.type==='reading').map(q=>q.passageId))];
   const groups=ids.map(id=>pool.filter(q=>q.passageId===id).sort((a,b)=>a.passagePart-b.passagePart));
   const fresh=shuffle(groups.filter(g=>g.every(q=>!avoid.has(q.id)))),seen=shuffle(groups.filter(g=>g.some(q=>avoid.has(q.id))));
   blocks.push(...[...fresh,...seen].slice(0,count/4).map(g=>g.map(q=>q.id)));continue;
  }
  if(category==='cubes'){
   ['stairs','stack','floor'].forEach((family,i)=>pickType(pool.filter(q=>q.cubeFamily===family),Math.floor((count+2-i)/3),previous).forEach(q=>blocks.push([q.id])));continue;
  }
  const choices=pool.filter(q=>{
   if(category==='flat'||category==='solid')return q.geometry===category;
   if(q.category)return q.category===category;
   if(category==='blend')return q.type==='choice'&&q.topic==='注音拼合';
   if(category==='choice')return q.type==='choice'&&!q.geometry&&q.topic!=='注音拼合';
   return q.type===category;
  });
  const chosen=pickType(choices,count,previous);if(chosen.length!==count)throw Error('題庫不足：'+subject+'/'+category);
  chosen.forEach(q=>blocks.push([q.id]));
 }
 const ids=shuffle(blocks).flat();if(ids.length!==40||new Set(ids).size!==40)throw Error('試卷題數錯誤');return ids;
}

const MATH_PLANS={
 10:{flat:2,solid:1,cubes:3,reading:0,tf:1,fill:2},

function mixedTypeDraw(subject,count,previous=[]){
  const pool=BANK.filter(q=>q.subject===subject),avoid=new Set(previous),readingPool=pool.filter(q=>q.type==='reading');
  const plan=subject==='math'?MATH_PLANS[count]:null;
  const readingCount=plan?plan.reading:Math.min(readingPool.length,Math.max(4,Math.floor(count/10)*4)),tfCount=plan?plan.tf:Math.floor(count/5),fillCount=plan?plan.fill:Math.floor(count/5),choiceCount=count-readingCount-tfCount-fillCount;
  const blocks=[];
  // Each math paper includes several cube questions from all three families.
  if(subject==='math'){
    for(const geometry of ['flat','solid'])for(const q of pickType(pool.filter(q=>q.geometry===geometry),plan[geometry],previous))blocks.push([q.id]);
    ['stairs','stack','floor'].forEach((family,i)=>{const n=Math.floor((plan.cubes+2-i)/3);for(const q of pickType(pool.filter(q=>q.cubeFamily===family),n,previous))blocks.push([q.id]);});
    for(const q of pickType(pool.filter(q=>q.type==='choice'&&!q.geometry),choiceCount-plan.flat-plan.solid-plan.cubes,previous))blocks.push([q.id]);
  }else for(const q of pickType(pool.filter(q=>q.type==='choice'),choiceCount,previous))blocks.push([q.id]);
  for(const [type,n] of [['tf',tfCount],['fill',fillCount]])for(const q of pickType(pool.filter(q=>q.type===type),n,previous))blocks.push([q.id]);
  const groups=[...new Set(readingPool.map(q=>q.passageId))].map(id=>readingPool.filter(q=>q.passageId===id).sort((a,b)=>a.passagePart-b.passagePart));
  const fresh=shuffle(groups.filter(g=>g.every(q=>!avoid.has(q.id)))),seen=shuffle(groups.filter(g=>g.some(q=>avoid.has(q.id))));
  for(const group of [...fresh,...seen].slice(0,readingCount/4))blocks.push(group.map(q=>q.id));
  return shuffle(blocks).flat();
}

function validAnswer(q,a){
 if(a===undefined)return true;
 if(q.type==='dictation')return Array.isArray(a)&&a.length===q.slots&&a.every(s=>typeof s==='string'&&s.length<=6&&/^[ㄅ-ㄩˊˇˋ˙]*$/.test(s));
 if(q.type==='pair')return Array.isArray(a)&&a.length<=2&&new Set(a).size===a.length&&a.every(n=>Number.isInteger(n)&&n>=0&&n<q.options.length);
 if(isSlots(q))return Array.isArray(a)&&a.length===q.slots&&a.every((n,i)=>Number.isInteger(n)&&(n===-1||(n>=0&&n<q.options.length&&(!q.slotOptions||q.slotOptions[i].includes(n)))))&&(q.type!=='match'||new Set(a.filter(n=>n!==-1)).size===a.filter(n=>n!==-1).length);
 return Number.isInteger(a)&&a>=0&&a<q.options.length;

function answered(q,a){

 if(q.type==='dictation')return a.length===q.slots&&a.every(s=>/[ㄅ-ㄩ]/.test(s));

function correctAnswer(q,a){

function saveChoice(q,opt){

 if(q.type==='pair'){
  const a=[...(session.answers[q.id]||[])];if(a.includes(opt))a.splice(a.indexOf(opt),1);else if(a.length<2)a.push(opt);
  if(a.length)session.answers[q.id]=a;else delete session.answers[q.id];
 }else if(isSlots(q)){

function editSound(key){
 if(session?.status!=='active')return;const q=byId(session.ids[session.index]);if(q.type!=='dictation')return;
 const values=[...(session.answers[q.id]||Array(q.slots).fill(''))];let s=values[activeSlot];
 if(key==='delete')s=s.slice(0,-1);else if(key==='clear')s='';
 else if(/[ˊˇˋ˙]/.test(key))s=s.replace(/[ˊˇˋ˙]/g,'')+key;
 else if(/^[ㄅ-ㄩ]$/.test(key)&&s.replace(/[ˊˇˋ˙]/g,'').length<3){const tone=(s.match(/[ˊˇˋ˙]/)||[''])[0];s=s.replace(/[ˊˇˋ˙]/g,'')+key+tone;}
 values[activeSlot]=s;if(values.some(Boolean))session.answers[q.id]=values;else delete session.answers[q.id];persist();renderQuestion(false);
}
function stopSpeech(){speechToken++;speechRequest=null;window.speechSynthesis?.cancel();}
function speechMessage(text){const el=document.getElementById('speech-status');if(el)el.textContent=text;}
function playDictation(){
 if(session?.status!=='active')return;const q=byId(session.ids[session.index]);if(q.type!=='dictation')return;
 stopSpeech();const token=speechToken,synth=window.speechSynthesis;
 if(!synth||!window.SpeechSynthesisUtterance){speechMessage('這個瀏覽器無法播放，請用下方「家長代念」。');return;}
 const voices=synth.getVoices(),voice=voices.find(v=>/^zh[-_]TW$/i.test(v.lang))||voices.find(v=>/^zh[-_](CN|SG)$/i.test(v.lang))||voices.find(v=>/^zh$/i.test(v.lang));
 if(voices.length&&!voice){speechMessage('這台裝置沒有國語語音，請用下方「家長代念」。');return;}
 const utterance=new window.SpeechSynthesisUtterance(q.spoken+'。'+q.spoken+'。');
 utterance.lang=voice?.lang||'zh-TW';if(voice)utterance.voice=voice;utterance.rate=.75;utterance.pitch=1;
 speechRequest=utterance;let began=false;
 utterance.onstart=()=>{began=true;if(token===speechToken)speechMessage('正在播放，請仔細聽。');};
 utterance.onend=()=>{if(token===speechToken){speechRequest=null;speechMessage('播放結束。可以再聽一次。');}};
 utterance.onerror=()=>{if(token===speechToken){speechRequest=null;speechMessage('播放未成功，請再試一次，或用「家長代念」。');}};
 speechMessage('準備播放……');synth.speak(utterance);
 setTimeout(()=>{if(token===speechToken&&!began){stopSpeech();speechMessage('沒有聽到聲音時，請再按播放，或用「家長代念」。');}},7000);
}
window.speechSynthesis?.getVoices();
window.speechSynthesis?.addEventListener('voiceschanged',()=>{window.speechSynthesis.getVoices();});

const app=document.getElementById('app');let session=null,mode='zh',filterWrong=false,storageOK=true,dialogAction=null;
const byId=id=>BANK.find(q=>q.id===id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(session));storageOK=true;}catch{storageOK=false;}}
function restore(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s||s.version!==VERSION||!['active','paused','done'].includes(s.status)||!Array.isArray(s.ids)||!s.ids.length||new Set(s.ids).size!==s.ids.length||s.ids.some(id=>!byId(id))||!s.answers||!s.orders||!Array.isArray(s.flags)||!Number.isFinite(s.elapsed)||s.elapsed<0||!Number.isInteger(s.index)||s.index<0||s.index>=s.ids.length)return null;for(const id of s.ids){const q=byId(id),order=s.orders[id],a=s.answers[id];if(!Array.isArray(order)||order.length!==q.options.length||new Set(order).size!==order.length||order.some(v=>!Number.isInteger(v)||v<0||v>=q.options.length)||!validAnswer(q,a))return null;}s.name=String(s.name||'').slice(0,16);if(s.status==='active'){if(Number.isFinite(s.since))s.elapsed+=Math.max(0,Date.now()-s.since);s.since=null;s.status='paused';}return s;}catch{return null;}}
const elapsed=()=>session?session.elapsed+(session.status==='active'&&session.since?Math.max(0,Date.now()-session.since):0):0;
const formatTime=ms=>`${String(Math.floor(ms/60000)).padStart(2,'0')}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}`;
function stopClock(){session.elapsed=elapsed();session.since=null;}
function progress(){return session.ids.filter(id=>answered(byId(id),session.answers[id])).length;}
function score(s=session){const correct=s.ids.filter(id=>correctAnswer(byId(id),s.answers[id])).length;return{correct,total:s.ids.length,score:Math.round(correct/s.ids.length*1000)/10};}

function showResult(){stopSpeech();const s=score(),wrong=session.ids.filter(id=>!correctAnswer(byId(id),session.answers[id])),shown=filterWrong?wrong:session.ids;app.innerHTML=`<section class="result-head"><div class="eyebrow">${session.practice?'錯題練習完成':'今天的挑戰完成了'}</div><h1>${s.score===100?'每一題都答對了！':s.score>=80?'很棒，繼續累積小進步！':'完成了！一起看看可以進步的地方。'}</h1><p>${esc(session.name||'小小探險家')}，謝謝你認真完成這份練習。</p><div class="score-ring"><strong>${s.score}</strong><span>／100 分</span></div><div class="result-stats"><span class="stat">答對 <strong>${s.correct} / ${s.total}</strong> 題</span><span class="stat">用時 <strong>${formatTime(elapsed())}</strong></span>${['zh','math'].filter(sub=>session.ids.some(id=>byId(id).subject===sub)).map(sub=>{const ids=session.ids.filter(id=>byId(id).subject===sub);return `<span class="stat">${sub==='zh'?'國語':'數學'} <strong>${ids.filter(id=>correctAnswer(byId(id),session.answers[id])).length} / ${ids.length}</strong> 題</span>`;}).join('')}</div><div class="actions">${wrong.length?'<button class="primary" data-action="retry">只練錯題 →</button>':''}<button class="secondary" data-action="home">再選一份試卷</button><button class="secondary" data-action="download">下載成績</button><button class="secondary" data-action="print">列印成績</button></div><p class="tiny">${session.practice?'這次是錯題練習，分數依本次題數換算為百分制。':'通用練習成績，僅供複習參考。'} 成績與小名不會上傳。</p></section><div class="review-heading"><h2>一起看看每一題</h2><button class="secondary" data-action="filter" aria-pressed="${filterWrong}">${filterWrong?'顯示全部題目':'只看錯題與未作答'}</button></div>${shown.length?shown.map(id=>{const q=byId(id),n=session.ids.indexOf(id),correct=correctAnswer(q,session.answers[id]);return `<article class="review-item ${correct?'':'wrong'}"><span class="result-title ${correct?'good':'wrong-label'}">第 ${n+1} 題 · ${q.subject==='zh'?'國語':'數學'} · ${correct?'✓ 答對了':session.answers[id]===undefined?'未作答':'再練習一下'}</span>${passageView(q)}<h3>${promptView(q,session.answers[id])}</h3>${visualView(q)}<p>你的答案：<strong>${answerView(q,session.answers[id])}</strong>　<span class="good">正確答案：<strong>${answerView(q,q.answer)}</strong></span></p><p>${q.explanation}</p></article>`;}).join(''):'<div class="empty">這次沒有錯題，全部答對了！ ✦</div>'}`;window.scrollTo({top:0,behavior:'instant'});}
function download(){const s=score(),plain=html=>{const el=document.createElement('div');el.innerHTML=html;el.querySelectorAll('rt,rp').forEach(n=>n.remove());return el.textContent;};const text=['小一上學期期中通用練習卷',`小名：${session.name||'小小探險家'}`,`日期：${new Date(session.finishedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})}`,`類型：${session.practice?'錯題練習':'正式練習'}`,`成績：${s.score} / 100；答對 ${s.correct} / ${s.total} 題；用時 ${formatTime(elapsed())}`,'',...session.ids.map((id,i)=>{const q=byId(id);return `${i+1}. 【${TYPE_NAMES[q.type]}】${q.plain}\n${q.passageId?PASSAGES[q.passageId].plain+'\n':''}${plain(q.visual)}\n你的答案：${plain(answerView(q,session.answers[id]))}\n正確答案：${plain(answerView(q,q.answer))}\n解析：${plain(q.explanation)}\n`;})].join('\n');const url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='小一期中練習成績.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.mode){const name=document.getElementById('nickname').value;mode=b.dataset.mode;showHome();document.getElementById('nickname').value=name;return;}if(b.dataset.slot!==undefined&&session?.status==='active'){const q=byId(session.ids[session.index]),n=Number(b.dataset.slot);if(isSlots(q)&&Number.isInteger(n)&&n>=0&&n<q.slots){activeSlot=n;renderQuestion(false);}return;}if(b.dataset.key!==undefined){editSound(b.dataset.key);return;}if(b.dataset.answer!==undefined&&session?.status==='active'){saveChoice(byId(session.ids[session.index]),Number(b.dataset.answer));return;}
if(b.dataset.question!==undefined&&session?.status==='active'){session.index=Number(b.dataset.question);persist();renderQuestion();return;}switch(b.dataset.action){case 'listen':playDictation();break;case 'stop-audio':stopSpeech();speechMessage('已停止，可以再播放。');break;case 'sound-delete':editSound('delete');break;case 'sound-clear':editSound('clear');break;case 'parent-word':{const q=byId(session.ids[session.index]),el=document.getElementById('parent-word');if(q.type==='dictation'&&session.status==='active'&&el){const visible=!!el.textContent;el.textContent=visible?'':q.spoken;b.textContent=visible?'顯示給家長看':'關閉詞語提示';}break;}case 'clear-answer':if(session?.status==='active'){delete session.answers[session.ids[session.index]];activeSlot=0;persist();renderQuestion(false);}break;
case 'clear':ask('清除這份作答紀錄？','將清除這台裝置上本試卷的答案與成績。想保留成績，請先下載。','清除紀錄',()=>{try{localStorage.removeItem(KEY);session=null;showHome();}catch{ask('暫時無法清除','瀏覽器拒絕了儲存存取，原紀錄仍保留。','關閉',()=>{},'關閉');}},'保留紀錄');break;case 'start':{const begin=()=>start();session&&session.status!=='done'?ask('開始一份新試卷？','目前尚未完成的答案將被新試卷取代。','開始新試卷',begin,'保留原試卷'):begin();break;}case 'resume':if(session.status==='done')showResult();else{session.status='active';session.since=Date.now();persist();renderQuestion();}break;case 'next':if(session.index===session.ids.length-1)submit();else{session.index++;persist();renderQuestion();}break;case 'previous':if(session.index>0){session.index--;persist();renderQuestion();}break;case 'flag':{const id=session.ids[session.index];session.flags=session.flags.includes(id)?session.flags.filter(v=>v!==id):[...session.flags,id];persist();renderQuestion(false);break;}case 'pause':pause();break;case 'home':showHome();window.scrollTo(0,0);break;case 'submit':submit();break;case 'filter':filterWrong=!filterWrong;showResult();break;case 'retry':{const ids=session.ids.filter(id=>!correctAnswer(byId(id),session.answers[id]));ask('再練一次錯題？','開始後會以本次錯題練習取代上次成績；想保留上次成績，請先下載。','開始錯題練習',()=>start(ids,true),'保留成績');break;}case 'download':download();break;case 'print':window.print();break;}});

document.getElementById('dialog-cancel').addEventListener('click',()=>{document.getElementById('confirm-dialog').close();dialogAction=null;});
document.getElementById('dialog-ok').addEventListener('click',()=>{document.getElementById('confirm-dialog').close();const fn=dialogAction;dialogAction=null;fn?.();});
document.getElementById('confirm-dialog').addEventListener('cancel',()=>{dialogAction=null;});
setInterval(()=>{const timer=document.getElementById('timer');if(timer&&session?.status==='active')timer.textContent=formatTime(elapsed());},1000);
session=restore();if(session)persist();showHome();
</script>
</body>
</html>

;flex-wrap:wrap}.stat{padding:12px 22px;border:1px solid var(--line);border-radius:12px;background:white;font-size:14px}.actions{display:flex;justify-content:center;gap:12px;margin:22px 0;flex-wrap:wrap}.review-heading{display:flex;align-items:center;justify-content:space-between;margin:34px 0 18px;gap:15px}.review-heading h2{font-size:22px}.review-item{padding:22px;margin-bottom:15px;background:white;border:1px solid var(--line);border-left:5px solid #b7cdbc;border-radius:14px;break-inside:avoid}.review-item.wrong{border-left-color:#e5a271}.review-item h3{font-size:20px;line-height:2.4;margin:8px 0}.review-item h3 ruby{margin:0 3px}.review-item .visual{font-size:38px;min-height:70px;padding:12px;max-width:520px;margin:12px 0}.review-item p{font-size:15px;margin:8px 0}.review-item p rt{font-size:.5em}.good{color:var(--green)}.wrong-label{color:var(--red)}.result-title{font-weight:700;font-size:13px}.empty{text-align:center;padding:28px;background:var(--light);border-radius:16px}footer{text-align:center;color:var(--muted);padding:10px 20px 30px;font-size:12px}dialog{color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:30px;width:min(440px,calc(100% - 28px));box-shadow:0 20px 80px #12332f33}dialog::backdrop{background:#18372d66}dialog h2{font-size:24px;margin-bottom:12px}dialog p{color:var(--muted);margin-bottom:20px}dialog .actions{margin-bottom:0}.pause{text-align:center;padding:65px 24px}.pause h2{font-size:30px;margin:12px 0}.pause p{color:var(--muted);margin-bottom:22px}.print-only{display:none}

<header><div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> 小小學習探險家</div><span class="tag">一 年 級 ／ 上 學 期</span></header>
<main id="app"></main>
<footer>慢慢讀、仔細想，每一次練習都是進步。<br>通用練習卷 · 作答紀錄只保存在這台裝置的瀏覽器</footer>
<dialog id="confirm-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-message"></p><div class="actions"><button class="secondary" id="dialog-cancel">繼續作答</button><button class="primary" id="dialog-ok">確定交卷</button></div></dialog>
<script>
'use strict';
const VERSION=1,KEY='toybox-grade1-midterm-v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ruby(text,reading){const syllables=reading.trim().split(/\s+/);let i=0;const html=[...text].map(c=>/[\u3400-\u9fff]/.test(c)?`<ruby>${c}<rp>（</rp><rt>${syllables[i++]||''}</rt><rp>）</rp></ruby>`:esc(c)).join('');if(i!==syllables.length)throw Error('注音字數不符：'+text);return html;}
const R=ruby;
const Z=(id,p,visual,options,answer,explanation,topic='注音拼讀')=>({id,subject:'zh',p:esc(p),plain:p,visual,options:options.map(esc),answer,explanation:esc(explanation),topic});
const M=(id,p,reading,visual,options,answer,explanation,topic)=>({id,subject:'math',p:R(p,reading),plain:p,visual,options:options.map(String),answer,explanation:esc(explanation),topic});
const dots=(symbol,n)=>`<span class="count" aria-label="${Array(n).fill(symbol).join(' ')}">${Array(n).fill(symbol).join(' ')}</span>`;
const BANK=[
Z('z1','「山」的注音是哪一個？','⛰️',['ㄕㄢ','ㄙㄢ','ㄕㄤ','ㄙㄤ'],0,'山：ㄕㄢ。注意「ㄕ」和「ㄙ」不一樣。'),
Z('z2','「火」的注音是哪一個？','🔥',['ㄏㄜˇ','ㄏㄨㄛˇ','ㄏㄨㄛˊ','ㄏㄨˇ'],1,'火：ㄏㄨㄛˇ，有三個注音符號，讀第三聲。'),
Z('z3','「魚」的注音是哪一個？','🐟',['ㄩˇ','ㄧㄡˊ','ㄩˊ','ㄨˊ'],2,'魚：ㄩˊ，讀第二聲。'),
Z('z4','「兔」的注音是哪一個？','🐇',['ㄉㄨˋ','ㄊㄨˊ','ㄊㄨˇ','ㄊㄨˋ'],3,'兔：ㄊㄨˋ。開頭是ㄊ，讀第四聲。'),
Z('z5','「米」的注音是哪一個？','🍚',['ㄇㄧˇ','ㄋㄧˇ','ㄇㄧˊ','ㄇㄧˋ'],0,'米：ㄇㄧˇ，讀第三聲。'),
Z('z6','「ㄅ」加上「ㄚ」，可以拼成哪一個？','<span class="symbol">ㄅ ＋ ㄚ</span>',['ㄆㄚ','ㄅㄚ','ㄉㄚ','ㄇㄚ'],1,'ㄅ和ㄚ合起來，拼成ㄅㄚ。','注音拼合'),
Z('z7','「ㄇ」加上「ㄠ」，可以拼成哪一個？','<span class="symbol">ㄇ ＋ ㄠ</span>',['ㄇㄡ','ㄋㄠ','ㄇㄠ','ㄇㄢ'],2,'ㄇ和ㄠ合起來，拼成ㄇㄠ。','注音拼合'),
Z('z8','哪一個是「第三聲」的符號？','<span class="symbol">？</span>',['ˊ','ˋ','˙','ˇ'],3,'第三聲的聲調符號是「ˇ」。','聲調辨識'),
Z('z9','「ㄅㄆㄇㄈ」裡，少了哪一個？','<span class="symbol">ㄅ ㄆ □ ㄈ</span>',['ㄇ','ㄋ','ㄌ','ㄊ'],0,'正確順序是ㄅ、ㄆ、ㄇ、ㄈ。','符號辨識'),
Z('z10','「ㄚ」和哪一個完全一樣？','<span class="symbol">ㄚ</span>',['ㄟ','ㄚ','ㄠ','ㄞ'],1,'ㄚ和ㄚ完全相同。觀察符號的形狀。','符號辨識'),
Z('z11','「花」的注音是哪一個？','🌸',['ㄏㄚ','ㄈㄚ','ㄏㄨㄚ','ㄏㄨㄚˊ'],2,'花：ㄏㄨㄚ，讀第一聲，不標聲調符號。'),
Z('z12','「狗」的注音是哪一個？','🐕',['ㄎㄡˇ','ㄍㄡˊ','ㄍㄨˇ','ㄍㄡˇ'],3,'狗：ㄍㄡˇ。開頭是ㄍ，讀第三聲。'),
Z('z13','「雨」的注音是哪一個？','🌧️',['ㄩˇ','ㄩˊ','ㄨˇ','ㄩˋ'],0,'雨：ㄩˇ。魚是第二聲，雨是第三聲。'),
Z('z14','「手」的注音是哪一個？','✋',['ㄙㄡˇ','ㄕㄡˇ','ㄕㄡˊ','ㄕㄨˇ'],1,'手：ㄕㄡˇ。注意ㄕ和ㄙ的差別。'),
Z('z15','「牛」的注音是哪一個？','🐄',['ㄌㄧㄡˊ','ㄋㄧㄡˇ','ㄋㄧㄡˊ','ㄋㄡˊ'],2,'牛：ㄋㄧㄡˊ，有三個注音符號，讀第二聲。'),
Z('z16','「ㄊ」加上「ㄨ」，可以拼成哪一個？','<span class="symbol">ㄊ ＋ ㄨ</span>',['ㄉㄨ','ㄊㄡ','ㄋㄨ','ㄊㄨ'],3,'ㄊ和ㄨ合起來，拼成ㄊㄨ。','注音拼合'),
Z('z17','哪一個是「第二聲」的符號？','<span class="symbol">？</span>',['ˊ','ˇ','ˋ','˙'],0,'第二聲的聲調符號是「ˊ」。','聲調辨識'),
Z('z18','哪一個是「第四聲」的符號？','<span class="symbol">？</span>',['ˇ','ˋ','ˊ','˙'],1,'第四聲的聲調符號是「ˋ」。','聲調辨識'),
Z('z19','「ㄉㄊㄋㄌ」裡，少了哪一個？','<span class="symbol">ㄉ ㄊ □ ㄌ</span>',['ㄇ','ㄅ','ㄋ','ㄈ'],2,'正確順序是ㄉ、ㄊ、ㄋ、ㄌ。','符號辨識'),
Z('z20','「ㄝ」和哪一個完全一樣？','<span class="symbol">ㄝ</span>',['ㄜ','ㄟ','ㄞ','ㄝ'],3,'ㄝ和ㄝ完全相同。ㄝ和ㄜ是不同的符號。','符號辨識'),
M('m1','一共有幾顆星星？','ㄧˊ ㄍㄨㄥˋ ㄧㄡˇ ㄐㄧˇ ㄎㄜ ㄒㄧㄥ ㄒㄧㄥ',dots('⭐',6),['5','6','7','8'],1,'一顆一顆數，共有6顆星星。','10以內的數'),
M('m2','空格裡要填哪個數字？','ㄎㄨㄥˋ ㄍㄜˊ ㄌㄧˇ ㄧㄠˋ ㄊㄧㄢˊ ㄋㄚˇ ㄍㄜ˙ ㄕㄨˋ ㄗˋ','<span class="numberline">3　4　□　6</span>',['4','5','7','8'],1,'依序是3、4、5、6，所以要填5。','數的順序'),

const app=document.getElementById('app');let session=null,mode='mixed',filterWrong=false,storageOK=true,dialogAction=null;
const byId=id=>BANK.find(q=>q.id===id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(session));storageOK=true;}catch{storageOK=false;}}
function restore(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s||s.version!==VERSION||!['active','paused','done'].includes(s.status)||!Array.isArray(s.ids)||!s.ids.length||new Set(s.ids).size!==s.ids.length||s.ids.some(id=>!byId(id))||!s.answers||!s.orders||!Array.isArray(s.flags)||!Number.isFinite(s.elapsed)||s.elapsed<0||!Number.isInteger(s.index)||s.index<0||s.index>=s.ids.length)return null;for(const id of s.ids){const q=byId(id),order=s.orders[id],a=s.answers[id];if(!Array.isArray(order)||order.length!==q.options.length||new Set(order).size!==order.length||order.some(v=>!Number.isInteger(v)||v<0||v>=q.options.length)||(a!==undefined&&(!Number.isInteger(a)||a<0||a>=q.options.length)))return null;}s.name=String(s.name||'').slice(0,16);if(s.status==='active'){if(Number.isFinite(s.since))s.elapsed+=Math.max(0,Date.now()-s.since);s.since=null;s.status='paused';}return s;}catch{return null;}}
const elapsed=()=>session?session.elapsed+(session.status==='active'&&session.since?Math.max(0,Date.now()-session.since):0):0;
const formatTime=ms=>`${String(Math.floor(ms/60000)).padStart(2,'0')}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}`;
function stopClock(){session.elapsed=elapsed();session.since=null;}
function progress(){return session.ids.filter(id=>session.answers[id]!==undefined).length;}
function score(s=session){const correct=s.ids.filter(id=>s.answers[id]===byId(id).answer).length;return{correct,total:s.ids.length,score:Math.round(correct/s.ids.length*1000)/10};}
function showHome(){app.innerHTML=`<section class="hero"><div><div class="eyebrow">LITTLE STEPS, BIG DISCOVERIES</div><h1>小小練習，<br><span>大大進步。</span></h1><p class="intro">小一上學期 · 期中通用練習卷<br>準備好了嗎？一起完成今天的小挑戰。</p><div class="chips"><span class="chip">✧ 國語注音</span><span class="chip">＋ 數學基礎</span><span class="chip">✓ 自動計分</span></div></div>${ART}</section>${session?`<div class="resume-box"><span>${session.status==='done'?'上次的練習已完成，可以查看成績。':`有一份還沒完成的試卷（已答 ${progress()} / ${session.ids.length} 題）。`}</span><button class="secondary" data-action="resume">${session.status==='done'?'查看上次成績':'繼續上次作答'}</button></div>`:''}<div class="setup"><section class="panel"><h2 class="section-title"><span class="small-number">1</span> 選一份今天的挑戰</h2><div class="modes" role="group" aria-label="考試科目"><button class="mode" data-mode="mixed" aria-pressed="${mode==='mixed'}"><strong>ㄅ ＋ 1</strong>國語＋數學</button><button class="mode" data-mode="zh" aria-pressed="${mode==='zh'}"><strong>ㄅ ㄆ ㄇ</strong>只考國語</button><button class="mode" data-mode="math" aria-pressed="${mode==='math'}"><strong>1 2 3</strong>只考數學</button></div><div class="field-row"><label>題數<select id="length" aria-label="題數"><option value="20">20 題 · 每題 5 分</option ${mode!=='mixed'?'disabled':''} value="40">40 題 · 每題 2.5 分</option></select></label><label>孩子的小名（可不填）<input id="nickname" maxlength="16" autocomplete="off" placeholder="小小探險家"></label></div><button class="primary start" data-action="start">開始作答 <span aria-hidden="true">→</span></button><p class="tiny" id="paper-summary">${mode==='mixed'?'國語 10 題＋數學 10 題':'單科 20 題'} · 滿分 100 分 · 不限時</p><p class="tiny" style="margin-top:6px">點選答案後按「下一題」；交卷前都可以修改。</p></section><aside class="panel scope"><h2 class="section-title"><span class="small-number">2</span> 開考前，家長看一下</h2><div class="scope-item"><span class="subject-icon">ㄅ</span><div><strong>國語｜注音基本功</strong><p>注音符號辨識、簡單拼讀、聲調。<br>以圖像、單字與選擇題練習。</p></div></div><div class="scope-item"><span class="subject-icon">5</span><div><strong>數學｜10 以內的數</strong><p>數量、順序、大小、分合、位置與長短。<br>題目及文字選項均附注音；完整卷另含簡單加減。</p></div></div><div class="note">這是通用複習卷，未對應特定出版社或學校進度。建議先確認孩子已學過上述範圍；國語題幹不懂時，可由家長讀題。作答時不顯示答案，交卷後才看成績與解析。</div></aside></div>`;}
function start(ids,practice=false){const count=Number(document.getElementById('length')?.value||20),name=document.getElementById('nickname')?.value.trim()||session?.name||'';if(!ids){ids=mode==='mixed'?[...BANK.filter(q=>q.subject==='zh').slice(0,count/2),...BANK.filter(q=>q.subject==='math').slice(0,count/2)].map(q=>q.id):BANK.filter(q=>q.subject===mode).map(q=>q.id);}session={version:VERSION,ids,answers:{},orders:Object.fromEntries(ids.map(id=>[id,shuffle(byId(id).options.map((_,i)=>i))])),flags:[],index:0,status:'active',elapsed:0,since:Date.now(),name,practice,startedAt:new Date().toISOString()};filterWrong=false;persist();renderQuestion();}
function renderQuestion(focus=true){const q=byId(session.ids[session.index]);app.innerHTML=`<div class="exam-top"><div><div class="eyebrow">${session.practice?'再練一次 · 錯題練習':'一年級上學期 · 期中通用練習'}</div><h1>${esc(session.name||'小小探險家')}，照自己的步調來。</h1></div><div style="text-align:right"><div class="time">已用 <span id="timer">${formatTime(elapsed())}</span></div><button class="text-button" data-action="pause">暫停休息</button></div></div><div class="progress-label"><span>已完成 ${progress()} / ${session.ids.length} 題</span><span>每題 ${Math.round(100/session.ids.length*100)/100} 分</span></div><div class="progress-track"><div class="progress-fill" style="width:${progress()/session.ids.length*100}%"></div></div><div class="exam-grid"><div><section class="question-card"><div class="question-meta"><span class="subject-pill">${q.subject==='zh'?'國語注音':'數學'}</span><span class="question-number">第 ${session.index+1} 題 / ${session.ids.length} 題</span></div><h2 id="question-title" class="question-text" tabindex="-1">${q.p}</h2><div class="visual">${q.visual}</div><div class="answers ${q.options.some(o=>o.includes('<ruby>'))?'word-answers':''}" role="group" aria-labelledby="question-title">${session.orders[q.id].map((opt,i)=>`<button class="answer" data-answer="${opt}" aria-pressed="${session.answers[q.id]===opt}"><span class="answer-letter">${session.answers[q.id]===opt?'✓':''}</span><span class="answer-value">${q.options[opt]}</span></button>`).join('')}</div><div class="question-footer"><button class="secondary" data-action="previous" ${session.index===0?'disabled':''}>← ${R('上一題','ㄕㄤˋ ㄧˋ ㄊㄧˊ')}</button><button class="primary" data-action="next">${R(session.index===session.ids.length-1?'檢查試卷':'下一題',session.index===session.ids.length-1?'ㄐㄧㄢˇ ㄔㄚˊ ㄕˋ ㄐㄩㄢˋ':'ㄒㄧㄚˋ ㄧˋ ㄊㄧˊ')} →</button></div></section><div class="under-question"><button class="text-button flag-button" data-action="flag" aria-pressed="${session.flags.includes(q.id)}">${session.flags.includes(q.id)?'★ 已標記，等一下檢查':'☆ 這題等一下再檢查'}</button><span class="status" role="status">${storageOK?'作答已自動儲存':'瀏覽器無法儲存，請勿關閉頁面'}</span></div></div><aside class="side"><h2>我的作答進度</h2><nav class="numbers" aria-label="選擇題號">${session.ids.map((id,i)=>`<button class="qnum ${session.answers[id]!==undefined?'done':''} ${session.index===i?'current':''} ${session.flags.includes(id)?'flag':''}" data-question="${i}" aria-label="第${i+1}題，${session.answers[id]!==undefined?'已作答':'未作答'}${session.flags.includes(id)?'，待檢查':''}" ${session.index===i?'aria-current="step"':''}>${i+1}</button>`).join('')}</nav><div class="legend">綠色：已作答　白色：未作答<br>橘點：想再檢查　點題號可跳題</div><button class="primary" data-action="submit">${R('我要交卷','ㄨㄛˇ ㄧㄠˋ ㄐㄧㄠ ㄐㄩㄢˋ')} ✓</button></aside></div>`;if(focus)document.getElementById('question-title').focus({preventScroll:true});}
function pause(){stopClock();session.status='paused';persist();app.innerHTML=`<section class="panel pause"><div style="font-size:54px">☁</div><h2>休息一下，也很好。</h2><p>答案已保留，計時已暫停。<br>已完成 ${progress()} / ${session.ids.length} 題。</p><button class="primary" data-action="resume">繼續作答 →</button><button class="text-button" data-action="home">回到首頁</button></section>`;}
function ask(title,message,ok,fn,cancel='繼續作答'){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-message').textContent=message;document.getElementById('dialog-ok').textContent=ok;document.getElementById('dialog-cancel').textContent=cancel;dialogAction=fn;document.getElementById('confirm-dialog').showModal();}
function submit(){const missing=session.ids.length-progress(),flags=session.flags.length;ask(missing?`還有 ${missing} 題沒有作答`:'準備好交卷了嗎？',`${missing?'未作答的題目會以 0 分計算。':'你已經完成所有題目。'}${flags?` 還有 ${flags} 題標記待檢查。`:''} 交卷後會顯示成績與答案。`,'確定交卷',()=>{stopClock();session.status='done';session.finishedAt=new Date().toISOString();persist();showResult();});}
function showResult(){const s=score(),wrong=session.ids.filter(id=>session.answers[id]!==byId(id).answer),shown=filterWrong?wrong:session.ids;app.innerHTML=`<section class="result-head"><div class="eyebrow">${session.practice?'錯題練習完成':'今天的挑戰完成了'}</div><h1>${s.score===100?'每一題都答對了！':s.score>=80?'很棒，繼續累積小進步！':'完成了！一起看看可以進步的地方。'}</h1><p>${esc(session.name||'小小探險家')}，謝謝你認真完成這份練習。</p><div class="score-ring"><strong>${s.score}</strong><span>／100 分</span></div><div class="result-stats"><span class="stat">答對 <strong>${s.correct} / ${s.total}</strong> 題</span><span class="stat">用時 <strong>${formatTime(elapsed())}</strong></span>${['zh','math'].filter(sub=>session.ids.some(id=>byId(id).subject===sub)).map(sub=>{const ids=session.ids.filter(id=>byId(id).subject===sub);return `<span class="stat">${sub==='zh'?'國語':'數學'} <strong>${ids.filter(id=>session.answers[id]===byId(id).answer).length} / ${ids.length}</strong> 題</span>`;}).join('')}</div><div class="actions">${wrong.length?'<button class="primary" data-action="retry">只練錯題 →</button>':''}<button class="secondary" data-action="home">再選一份試卷</button><button class="secondary" data-action="download">下載成績</button><button class="secondary" data-action="print">列印成績</button></div><p class="tiny">${session.practice?'這次是錯題練習，分數依本次題數換算為百分制。':'通用練習成績，僅供複習參考。'} 成績與小名不會上傳。</p></section><div class="review-heading"><h2>一起看看每一題</h2><button class="secondary" data-action="filter" aria-pressed="${filterWrong}">${filterWrong?'顯示全部題目':'只看錯題與未作答'}</button></div>${shown.length?shown.map(id=>{const q=byId(id),n=session.ids.indexOf(id),correct=session.answers[id]===q.answer;return `<article class="review-item ${correct?'':'wrong'}"><span class="result-title ${correct?'good':'wrong-label'}">第 ${n+1} 題 · ${q.subject==='zh'?'國語':'數學'} · ${correct?'✓ 答對了':session.answers[id]===undefined?'未作答':'再練習一下'}</span><h3>${q.p}</h3><div class="visual">${q.visual}</div><p>你的答案：<strong>${session.answers[id]===undefined?'未作答':q.options[session.answers[id]]}</strong>　<span class="good">正確答案：<strong>${q.options[q.answer]}</strong></span></p><p>${q.explanation}</p></article>`;}).join(''):'<div class="empty">這次沒有錯題，全部答對了！ ✦</div>'}`;window.scrollTo({top:0,behavior:'instant'});}
function download(){const s=score(),plain=html=>{const el=document.createElement('div');el.innerHTML=html;el.querySelectorAll('rt,rp').forEach(n=>n.remove());return el.textContent;};const text=['小一上學期期中通用練習卷',`小名：${session.name||'小小探險家'}`,`日期：${new Date(session.finishedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})}`,`類型：${session.practice?'錯題練習':'正式練習'}`,`成績：${s.score} / 100；答對 ${s.correct} / ${s.total} 題；用時 ${formatTime(elapsed())}`,'',...session.ids.map((id,i)=>{const q=byId(id);return `${i+1}. ${q.plain}\n${plain(q.visual)}\n你的答案：${session.answers[id]===undefined?'未作答':plain(q.options[session.answers[id]])}\n正確答案：${plain(q.options[q.answer])}\n解析：${plain(q.explanation)}\n`;})].join('\n');const url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='小一期中練習成績.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.mode){const name=document.getElementById('nickname').value;mode=b.dataset.mode;showHome();document.getElementById('nickname').value=name;return;}if(b.dataset.answer!==undefined&&session?.status==='active'){const id=session.ids[session.index];session.answers[id]=Number(b.dataset.answer);persist();renderQuestion(false);app.querySelector(`[data-answer="${b.dataset.answer}"]`)?.focus({preventScroll:true});return;}if(b.dataset.question!==undefined&&session?.status==='active'){session.index=Number(b.dataset.question);persist();renderQuestion();return;}switch(b.dataset.action){case 'start':{const begin=()=>start();session&&session.status!=='done'?ask('開始一份新試卷？','目前尚未完成的答案將被新試卷取代。','開始新試卷',begin,'保留原試卷'):begin();break;}case 'resume':if(session.status==='done')showResult();else{session.status='active';session.since=Date.now();persist();renderQuestion();}break;case 'next':if(session.index===session.ids.length-1)submit();else{session.index++;persist();renderQuestion();}break;case 'previous':if(session.index>0){session.index--;persist();renderQuestion();}break;case 'flag':{const id=session.ids[session.index];session.flags=session.flags.includes(id)?session.flags.filter(v=>v!==id):[...session.flags,id];persist();renderQuestion(false);break;}case 'pause':pause();break;case 'home':showHome();window.scrollTo(0,0);break;case 'submit':submit();break;case 'filter':filterWrong=!filterWrong;showResult();break;case 'retry':{const ids=session.ids.filter(id=>session.answers[id]!==byId(id).answer);ask('再練一次錯題？','開始後會以本次錯題練習取代上次成績；想保留上次成績，請先下載。','開始錯題練習',()=>start(ids,true),'保留成績');break;}case 'download':download();break;case 'print':window.print();break;}});
app.addEventListener('change',e=>{if(e.target.id==='length')document.getElementById('paper-summary').textContent=mode==='mixed'?`國語 ${e.target.value/2} 題＋數學 ${e.target.value/2} 題 · 滿分 100 分 · 不限時`:'單科 20 題 · 滿分 100 分 · 不限時';});
document.getElementById('dialog-cancel').addEventListener('click',()=>{document.getElementById('confirm-dialog').close();dialogAction=null;});
document.getElementById('dialog-ok').addEventListener('click',()=>{document.getElementById('confirm-dialog').close();const fn=dialogAction;dialogAction=null;fn?.();});
document.getElementById('confirm-dialog').addEventListener('cancel',()=>{dialogAction=null;});
setInterval(()=>{const timer=document.getElementById('timer');if(timer&&session?.status==='active')timer.textContent=formatTime(elapsed());},1000);
session=restore();if(session)persist();showHome();
</script>
</body>
</html>
